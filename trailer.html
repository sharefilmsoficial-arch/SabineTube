<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trailer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="trailer.css">
</head>
<body>

<header class="top-bar">
  <button class="hamburger">☰</button>
  <input id="search" name="search" class="search" type="text" placeholder="Buscar">
</header>

<div class="layout">

  <aside class="sidebar">
    <a href="index.html" class="side-item">
      <img src="iconos/home.png">
      <span>Inicio</span>
    </a>

      <a href="todas.html" class="side-item">
      <img src="iconos/todas.png">
      <span>Todo</span>
    </a>

      <a href="series.html" class="side-item">
      <img src="iconos/series.png">
      <span>Series</span>
    </a>

      <a href="history.html" class="side-item">
      <img src="iconos/historial-btn.png">
      <span>Historial</span>
    </a>

      <a href="R-18.html" class="side-item">
      <img src="iconos/fuera-de-r-18.png">
      <span>R-18</span>
    </a>
    
      <a href="maraton.html" class="side-item">
      <img src="iconos/new.png">
      <span>Recien Agregadas</span>
    </a>
    
  </aside>

  <main class="short-wrapper">

    <div class="short-card">

      <div class="video-bg">
        <video id="trailerVideo" loop playsinline></video>
      </div>

      <div class="right-bar">

        <div class="icon">
          <img src="iconos/like.png">
          <span>36 k</span>
        </div>

        <div class="icon">
          <img src="iconos/dislike.png">
        </div>

        <div class="icon">
          <img src="iconos/comment.png">
          <span>Comentarios</span>
        </div>

        <div class="icon" id="shareBtn" style="cursor: pointer;">
          <img src="iconos/compartir-96.png">
          <span>Compartir</span>
        </div>

        <div class="icon" id="watchBtn" style="cursor: pointer;">
          <img src="iconos/reproducir.png">
          <span>Ver</span>
        </div>

      </div>

      <div class="info">
        <h2 id="title"></h2>
        <h4 id="subtitle"></h4>
      </div>

    </div>

  </main>

</div>

<script src="movies.js"></script>
<script src="serie.js"></script>
<script src="trailer.js"></script>

</body>
</html>
