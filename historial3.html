
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi historial — ShareFilms</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px;
      background: #101014;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    .history-container {
      max-width: 1100px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      color: white;
      background: #292932;
    }

    button:hover {
      filter: brightness(1.2);
    }

    .clear-btn {
      background: #a83242;
    }

    .history-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .history-card {
      overflow: hidden;
      border-radius: 12px;
      background: #1b1b22;
      border: 1px solid #30303a;
    }

    .history-card a {
      color: inherit;
      text-decoration: none;
    }

    .history-card img {
      display: block;
      width: 100%;
      height: 155px;
      object-fit: cover;
      background: #292932;
    }

    .card-info {
      padding: 13px;
    }

    .card-info h2 {
      margin: 0 0 7px;
      font-size: 17px;
    }

    .meta {
      color: #b4b4c0;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .date {
      color: #858591;
      font-size: 12px;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0 13px 13px;
    }

    .remove-btn {
      padding: 7px 10px;
      font-size: 12px;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: #aaaab5;
      background: #1b1b22;
      border-radius: 12px;
    }

    /* =========================
       COMPATIBILIDAD CON HISTORY.JS
       ========================= */

    .history-list .card {
      overflow: hidden;
      border-radius: 12px;
      background: #1b1b22;
      border: 1px solid #30303a;
      cursor: pointer;
    }

    .history-list .card .thumb img {
      display: block;
      width: 100%;
      height: 155px;
      object-fit: cover;
      background: #292932;
    }

    .history-list .card .info {
      padding: 13px;
    }

    .history-list .card .info h3 {
      margin: 0 0 7px;
      font-size: 17px;
    }

    .history-list .card .channel {
      color: #b4b4c0;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .history-list .card .info p:not(.channel) {
      color: #858591;
      font-size: 12px;
    }

    .history-list .card .remove-btn {
      display: block;
      margin-left: auto;
      padding: 7px 10px;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      h1 {
        font-size: 23px;
      }
    }

    .link-btn {
      background: #00b8ab;
    }

    .to-back-btn {
      background: #0012b8;
    }

    .link-btn:hover,
    .to-back-btn:hover {
        filter: brightness(1.15);
    }
  </style>
</head>

<body>

  <main class="history-container">

    <header class="topbar">
      <h1>Mi historial</h1>

      <div class="actions">
        <button id="refreshHistory" type="button">
          Actualizar
        </button>

        <button id="clearHistory" class="clear-btn" type="button">
          Borrar historial
        </button>

        <button
            type="button"
            class="link-btn"
            title="Ir al inicio"
            onclick="window.location.href='index.html'">
            Inicio
        </button>

        <button
            type="button"
            class="to-back-btn"
            title="Volver a la página anterior"
            onclick="window.history.back()">
            Atrás
        </button>
      </div>
    </header>

    <section
      id="historyList"
      class="history-list"
      aria-live="polite">
    </section>

  </main>

  <script src="history.js"></script>

</body>
</html>
