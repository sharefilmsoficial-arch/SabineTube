<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi historial — ShareFilms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="https://img.icons8.com/nolan/64/youtube-play.png" type="image/x-icon">
</head>
<body>

  <header class="top-bar">
   <!-- Botón hamburguesa (decoración) -->
  <button class="hamburger" aria-label="Menú">
    ☰
  </button>
  <a href="index.html" class="logo-2"><img src="iconos/MyTube.png" alt="MyTube"></a>
  <input type="text" id="search" placeholder="Buscar">
</header>
<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <a href="index.html" class="side-item">
        <img src="iconos/home.png" alt="Principal">
        <span>Inicio</span>
      </a>

      <a class="side-item">
        <img src="iconos/shorts.png" alt="Shorts">
        <span>Shorts</span>
      </a>

      <a class="side-item">
        <img src="iconos/subs.png" alt="Suscripciones">
        <span>Suscripciones</span>
      </a>

      <a class="side-item">
        <img src="iconos/tu.png" alt="Tú">
        <span>Tú</span>
      </a>

      <a class="side-item">
        <img src="iconos/descargas.png" alt="Descargas">
        <span>Descargas</span>
      </a>

      <a href="todas.html" class="side-item">
        <img src="iconos/todas.png" alt="Todas">
        <span>Todas</span>
      </a>

      <a href="series.html" class="side-item">
        <img src="iconos/series.png" alt="Series">
        <span>Series</span>
      </a>

    <a href="history.html" class="side-item">
      <img src="iconos/en-historial.png">
      <span>Historial</span>
    </a>

      <a href="../facebook/facebook.com.html" class="side-item">
        <img src="iconos/FaceClone.png" alt="MyPost">
        <span>MyPost</span>
      </a>

    </aside>

    <main class="history-container">

      <header class="topbar">
        <h1>Historial de reproducciones</h1>

        <div class="actions">
          <button id="refreshHistory" type="button">
            Actualizar
          </button>

          <button
            id="clearHistory"
            class="clear-btn"
            type="button">
            Borrar historial
          </button>
        </div>
      </header>

      <section
        id="historyList"
        class="grid"
        aria-live="polite">
      </section>
    </main>
  </div>
  <script src="history.js"></script>
</body>
</html>
